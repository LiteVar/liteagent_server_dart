name: liteagent_server_dart
description: HTTP Server using `LiteAgent core for Dart`
version: 1.0.0
repository: https://github.com/LiteVar/liteagent_server_dart
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  yaml: ^3.1.3
  path: ^1.9.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  shelf_web_socket: ^2.0.1
  web_socket_channel: ^3.0.1
  logging: ^1.2.0
  json_annotation: ^4.9.0
  liteagent_core_dart:
    path: ../liteagent_core_dart
  drift: ^2.25.1
  sqlite3: ^2.7.4
  sse: ^4.1.7
  lzstring: ^2.0.0+2
  unique_id_dart: ^1.0.0

dev_dependencies:
  build_runner: ^2.5.4
  json_serializable: 6.9.5
  drift_dev: ^2.25.2
  http: ^1.1.0
  lints: ^3.0.0
  test: ^1.24.0
  dio: ^5.5.0+1
  dotenv: ^4.2.0
