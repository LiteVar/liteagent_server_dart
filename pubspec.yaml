name: lite_agent_core_dart_server
description: HTTP Server using `Lite Agent core for Dart`
version: 0.7.0
repository: https://github.com/LiteVar/lite_agent_core_dart_server

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  yaml: ^3.1.3
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  shelf_web_socket: ^2.0.1
  web_socket_channel: ^3.0.1
  logging: ^1.2.0
  json_annotation: ^4.9.0
  lite_agent_core_dart: #^0.5.1
    path: ../lite_agent_core_dart
  drift: ^2.25.1
  sqlite3: ^2.7.4
  sse: ^4.1.7
  lzstring: ^2.0.0+2

dev_dependencies:
  build_runner: ^2.4.9
  json_serializable: ^6.9.2
  drift_dev: ^2.25.2
  http: ^1.1.0
  lints: ^3.0.0
  test: ^1.24.0
  dio: ^5.5.0+1
  dotenv: ^4.2.0
